services:
  postgres:
    image: 'postgres:17.5'
    environment:
      POSTGRES_DB: dietitian
      POSTGRES_PASSWORD: manager0
      POSTGRES_USER: manager
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/data.sql:/docker-entrypoint-initdb.d/02-data.sql
